[project]
name = "colony-mcp"
version = "0.1.0"
description = "Colony MCP Server — agentic access to the Colony expense API"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.10.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.12.12",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary on second line
    "COM812", # Trailing comma (conflicts with formatter)
    "ISC001", # Implicit string concat (conflicts with formatter)
    "ANN401", # Any is intentional for the generic JSON API wrapper
]

[tool.ruff.lint.pydocstyle]
convention = "google"
